# Dedicated environment for Oriole (modern stack: Python 3.14, numpy 2, Qt 6).
#   conda env create -f environment.yml
#   conda activate oriole
#   python -m oriole
name: oriole
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - numpy>=2
  - tifffile
  - imageio
  - pillow
  - pyqt6>=6.7
  - pyqtgraph>=0.14
  - pytest
  - pip
  - pip:
      - nidaqmx        # holo shutter; optional at runtime, needs the NI-DAQmx driver on the rig
      - pyjavaz        # Snap / Live from Micro-Manager (its pycro-manager server); optional at runtime
