# Dedicated environment for Oriole (modern stack: Python 3.14, numpy 2, Qt 6).
#   conda env create -f environment.yml
#   conda activate oriole
#   python -m oriole gui
name: oriole
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - numpy>=2
  - scipy>=1.14
  - scikit-image>=0.25
  - tifffile
  - imageio
  - pillow
  - matplotlib-base
  - pyqt6>=6.7
  - pyqtgraph>=0.14
  - pytest
  - pip
  - pip:
      - nidaqmx        # holo shutter; optional at runtime, needs the NI-DAQmx driver on the rig
